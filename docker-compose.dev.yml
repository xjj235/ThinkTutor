services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: thinktutor
      POSTGRES_USER: thinktutor
      POSTGRES_PASSWORD: thinktutor-local-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - thinktutor-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thinktutor"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - thinktutor-redis:/data
volumes:
  thinktutor-postgres:
  thinktutor-redis:
